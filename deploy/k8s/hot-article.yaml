apiVersion: v1
kind: Service
metadata:
  name: hot-article
  labels:
    app: hot-article
spec:
  type: NodePort
  selector:
    app: hot-article
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30085
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hot-article
  labels:
    app: hot-article
spec:
  serviceName: hot-article
  replicas: 1
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: hot-article
  template:
    metadata:
      labels:
        app: hot-article
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: hot-article
          image: board-perf/hot-article
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: board-data
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: k8s
            # 힙은 컨테이너 메모리 한도의 70%. 나머지는 메타스페이스·스레드 스택·다이렉트 버퍼 몫
            - name: JAVA_OPTS
              value: "-XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError"
          # CPU 한도는 두지 않는다. 한도에 걸린 스로틀링이 지연 지표를 흐린다
          resources:
            requests:
              cpu: 500m
              memory: 768Mi
            limits:
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          # 부하 중 GC 멈춤으로 재시작되지 않게 liveness는 느슨하게, readiness는 트래픽만 뺀다
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
