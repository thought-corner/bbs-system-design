# 데이터 노드용 compose. 앱 노드(k3s)의 파드가 이 노드의 사설 IP로 붙는다.
#   MYSQL_ROOT_PASSWORD=<비밀번호> DATA_ADVERTISED_HOST=<이 노드 사설 IP> docker compose -f deploy/data/compose.yml up -d --wait
# 로컬 개발용 docker-compose.yml(board-e2e)과 프로젝트 이름을 나눈다.
name: board-data

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD를 지정한다}
    ports:
      - "3306:3306"
    volumes:
      - ../../docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # 초기화 중 임시 서버는 TCP를 열지 않으므로, 127.0.0.1 ping이 성공하면 초기화가 끝난 것이다
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 2s
      timeout: 3s
      retries: 60

  redis:
    image: redis:7.4
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # 앱 노드가 받는 브로커 주소. 데이터 노드의 사설 IP를 넣는다
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${DATA_ADVERTISED_HOST:?DATA_ADVERTISED_HOST를 지정한다}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 3s
      timeout: 10s
      retries: 40
