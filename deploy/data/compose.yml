# 데이터 노드용 compose. 앱 노드(k3s)의 파드가 이 노드의 사설 IP로 붙고, 부하 노드의 Prometheus가 exporter를 긁는다.
#   MYSQL_ROOT_PASSWORD=<비밀번호> DATA_ADVERTISED_HOST=<이 노드 사설 IP> docker compose -f deploy/data/compose.yml up -d --wait
# AWS에는 deploy/aws/render.sh가 만든 묶음(run.sh)으로 올린다.
# 로컬 개발용 docker-compose.yml(board-e2e)과 프로젝트 이름을 나눈다.
name: board-data

services:
  mysql:
    image: mysql:8.0
    # 버퍼 풀 기본 128MB로는 거의 모든 조회가 디스크로 간다. 노드 메모리에 맞춰 render.sh가 정한다 (m7g.large 8GiB → 5G)
    command: ["--innodb-buffer-pool-size=${MYSQL_BUFFER_POOL_SIZE:-5G}"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD를 지정한다}
    ports:
      - "3306:3306"
    volumes:
      - ../../docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # 초기화 중 임시 서버는 TCP를 열지 않으므로, 127.0.0.1 ping이 성공하면 초기화가 끝난 것이다
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 2s
      timeout: 3s
      retries: 60

  redis:
    image: redis:7.4
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # 앱 노드가 받는 브로커 주소. 데이터 노드의 사설 IP를 넣는다
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${DATA_ADVERTISED_HOST:?DATA_ADVERTISED_HOST를 지정한다}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 3s
      timeout: 10s
      retries: 40

  # --- exporter (부하 노드 Prometheus가 긁는다. 보안 그룹이 부하 노드에서만 연다)
  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    command: ["--mysqld.address=mysql:3306", "--mysqld.username=exporter"]
    environment:
      # docker/mysql/init.sql이 만드는 최소 권한 계정. 3306은 앱 노드에서만 열린다
      MYSQLD_EXPORTER_PASSWORD: exporter
    ports:
      - "9104:9104"
    depends_on:
      mysql:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "9121:9121"
    depends_on:
      redis:
        condition: service_healthy

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    command: ["--kafka.server=kafka:9092"]
    ports:
      - "9308:9308"
    depends_on:
      kafka:
        condition: service_healthy

  # 호스트 CPU·메모리·디스크·네트워크. 호스트 네트워크로 9100을 연다
  node-exporter:
    image: prom/node-exporter:v1.8.2
    command: ["--path.rootfs=/host"]
    network_mode: host
    pid: host
    volumes:
      - /:/host:ro
