# k3s 파드에서 쓰는 값. 데이터 노드 주소·비밀번호는 배포 때 만드는 ConfigMap board-data·Secret board-mysql에서 환경 변수로 받는다.
server:
  port: 8080
spring:
  data:
    redis:
      host: ${REDIS_HOST}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

article-read:
  # 원본은 같은 네임스페이스의 Service 이름으로 부른다
  origin:
    article-url: http://article:8080
    comment-url: http://comment:8080
    like-url: http://like:8080
    view-url: http://view:8080
