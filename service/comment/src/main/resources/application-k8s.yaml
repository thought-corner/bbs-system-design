# k3s 파드에서 쓰는 값. 데이터 노드 주소·비밀번호는 배포 때 만드는 ConfigMap board-data·Secret board-mysql에서 환경 변수로 받는다.
server:
  port: 8080
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:3306/comment?allowPublicKeyRetrieval=true&useSSL=false
    password: ${MYSQL_PASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

snowflake:
  # 서비스별 기준값 + 파드 순번 (deploy/entrypoint.sh)
  node-id: ${SNOWFLAKE_NODE_ID}
